name: Generate Daily Quiz

on:
  schedule:
    # 매일 UTC 21:00 (KST 06:00)에 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # 수동 실행 지원

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: daily-question-generator
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate daily question set for tomorrow
        run: npm run generate-daily -- 1 10 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 60일간 push가 없으면 GitHub가 scheduled workflow를 자동 비활성화한다.
      # 이 커밋 자체를 저장소 활동으로 만들어 그 카운터를 매일 리셋한다.
      - name: Record last successful run (keeps schedule from auto-disabling)
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-daily-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-daily-run.txt
          git diff --cached --quiet || git commit -m "chore: 데일리 퀴즈 배치 실행 기록"
          git push
